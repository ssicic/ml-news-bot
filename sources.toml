# Feeds the bot reads. Add / remove [[sources]] blocks freely.
#   filter = true  -> only items that match [settings].keywords (for broad feeds)
#   keywords = [...] -> per-source keyword list (overrides the global one)
#   exclude = "regex" -> skip items whose title matches
#   weight = 1..3    -> how much this source counts when picking the top 5

[settings]
top_n = 5              # send only the 5 best links a day (0 = send everything)
max_age_days = 3       # ignore posts older than this
per_source_cap = 5     # max links per source in one digest
keep_state_days = 60   # how long to remember already-sent links
keywords = [
  "LLM", "LLMs", "GPT", "Claude", "Gemini", "Llama", "transformer", "RAG", "agent", "agents",
  "machine learning", "deep learning", "neural", "AI", "ML", "MLOps", "LLMOps", "data science",
  "embedding", "embeddings", "fine-tuning", "fine-tune", "inference", "PyTorch", "diffusion",
  "eval", "evals", "benchmark", "vector database", "Hugging Face", "OpenAI", "Anthropic", "DeepMind",
]

